<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Artemis: the header's mark on a night tile (Cosmos palette: bg2 to bg, sky mark, azure glow).
       Source of the favicon and of shell/icon.png (bun run scripts/icon.ts). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040b26"/>
      <stop offset="1" stop-color="#02061a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <g clip-path="url(#clip)">
    <circle cx="512" cy="512" r="330" fill="none" stroke="#4c6fe0" stroke-opacity="0.18" stroke-width="2"/>
    <circle cx="512" cy="512" r="400" fill="none" stroke="#4c6fe0" stroke-opacity="0.10" stroke-width="2"/>
  </g>
  <g transform="translate(512 512) scale(17.5) translate(-16 -16)" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M16 2 L28 9 V23 L16 30 L4 23 V9 Z" stroke="#4c6fe0" stroke-opacity="0.75" stroke-width="2.2" filter="url(#glow)"/>
    <path d="M16 2 L28 9 V23 L16 30 L4 23 V9 Z" stroke="#7b98f0" stroke-width="1.5"/>
    <path d="M16 2 V16 M16 16 L28 9 M16 16 L4 9 M16 16 V30" stroke="#7b98f0" stroke-width="0.8" opacity="0.55"/>
    <circle cx="16" cy="16" r="3" fill="#7b98f0"/>
  </g>
</svg>
